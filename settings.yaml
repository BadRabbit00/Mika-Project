# config/settings.yaml — реестр настроек
#
# Единственный источник правды для:
#   - валидации /set
#   - генерации меню в боте
#   - вывода /help
#   - подсказки при вызове команды без аргумента
#
# Значения, изменённые через /set, лежат в БД и перекрывают default.
# locked: true — не показывается в меню и не меняется из чата.

groups:
  study:    {title: Обучение,   emoji: "📚"}
  mood:     {title: Настроение, emoji: "🎭"}
  rhythm:   {title: Ритм,       emoji: "🕐"}
  persona:  {title: Персона,    emoji: "✨"}
  curator:  {title: Куратор,    emoji: "🎓"}
  world:    {title: Мир,        emoji: "🌍"}
  chat:     {title: Общение,    emoji: "💬"}
  log:      {title: Логи,       emoji: "🔧"}
  system:   {title: Система,    emoji: "⚙️"}

settings:

# ── Обучение ─────────────────────────────────────────────────────

- key: study.min_articles
  group: study
  title: Минимум статей до конспекта
  type: int
  range: [2, 6]
  default: 3
  desc: Сколько статей она должна прочитать по теме, прежде чем сядет писать большой конспект.
  effect: Меньше — конспекты выходят чаще, но поверхностнее и с дырами. Больше — реже, но плотнее, и дольше висит в ожидании.

- key: study.quiz_threshold
  group: study
  title: Порог самопроверки
  type: float
  range: [0.3, 0.9]
  default: 0.6
  desc: Какая доля её собственных вопросов должна получить подтверждённый ответ из графа, чтобы она пошла писать конспект.
  effect: Ниже — пишет раньше и чаще ошибается, куратор её чаще валит. Выше — дольше сидит в WAITING и чаще пишет, что застряла.

- key: study.questions_per_round
  group: study
  title: Вопросов в круге самопроверки
  type: int
  range: [3, 10]
  default: 5
  desc: Сколько вопросов она задаёт себе за один круг.
  effect: Больше вопросов — точнее оценка готовности, но каждый круг дольше и дороже по времени.

- key: study.max_waiting_rounds
  group: study
  title: Кругов ожидания до сдачи
  type: int
  range: [2, 8]
  default: 4
  desc: Сколько раз подряд она может провалить самопроверку, прежде чем пойдёт писать конспект как есть.
  effect: Защита от вечного зацикливания на трудной теме. Меньше — быстрее движется, но с пробелами.

# ── Настроение ───────────────────────────────────────────────────

- key: mood.enabled
  group: mood
  title: Модель настроения
  type: bool
  default: true
  desc: Включает всю систему PAD. При выключении она пишет ровно и одинаково.
  effect: Выключать имеет смысл только для отладки промптов, когда нужен воспроизводимый вывод.

- key: mood.volatility
  group: mood
  title: Общая подвижность
  type: float
  range: [0.3, 2.0]
  default: 1.0
  desc: Множитель ко всем изменениям настроения сразу.
  effect: Выше — реагирует ярче на всё подряд, вплоть до истерички. Ниже — ровная и скучноватая. Крутить этот, а не отдельные коэффициенты.

- key: mood.decay_mult
  group: mood
  title: Скорость отхода
  type: float
  range: [0.3, 3.0]
  default: 1.0
  desc: Множитель к периодам полураспада всех трёх осей.
  effect: Выше — дольше держит состояние, обида тянется днями. Ниже — забывает за час, и настроение почти не влияет.

- key: mood.trigger_rate
  group: mood
  title: Частота триггеров
  type: float
  range: [0.0, 3.0]
  default: 1.0
  desc: Множитель к вероятности личных событий — ссор, звонков родителей, провалов в универе.
  effect: Выше — драма чаще, канал становится мыльной оперой. 0 — триггеров нет вообще, только учёба и быт.

- key: mood.cycle_enabled
  group: mood
  title: Физиологический цикл
  type: bool
  default: true
  desc: Медленный фон, меняющий чувствительность к событиям по 28-дневному кругу. В текст не попадает никогда.
  effect: Даёт недели, когда всё бесит, и недели, когда всё легко. Выключение делает фон ровным.

- key: mood.skip_post_when_low
  group: mood
  title: Молчать, когда плохо
  type: bool
  default: true
  desc: Разрешает ей вообще не писать пост, если настроение на дне.
  effect: Главный признак живого человека. Выключать не стоит — молчание объяснимо, а пост через силу выглядит механически.

# ── Ритм ─────────────────────────────────────────────────────────

- key: rhythm.posts_per_day
  group: rhythm
  title: Постов в день
  type: int
  range: [1, 5]
  default: 2
  desc: Целевое число сообщений в Дневнике за сутки. Фактическое зависит от настроения и событий.
  effect: Больше — насыщеннее лента, но быстрее выдыхается тема и растёт нагрузка на ноут.

- key: rhythm.offtop_per_week
  group: rhythm
  title: Офтопов в неделю
  type: int
  range: [0, 5]
  default: 2
  desc: Сколько личных сообщений не про учёбу.
  effect: Офтоп работает как контраст. Слишком много — канал перестаёт быть про безопасность, слишком мало — она выглядит роботом.

- key: rhythm.jitter_minutes
  group: rhythm
  title: Разброс времени публикации
  type: int
  range: [0, 120]
  default: 40
  desc: Случайное смещение от запланированного времени, в обе стороны.
  effect: Ноль — идеально ровное расписание, самый заметный признак бота.

- key: rhythm.quiet_from
  group: rhythm
  title: Начало тихих часов
  type: time
  default: "23:30"
  desc: Позже этого времени постов нет, если она не бодрствует по модели сна.
  effect: Перекрывается моделью сна — если легла в три, может писать до трёх.

# ── Персона ──────────────────────────────────────────────────────

- key: persona.emoji_max
  group: persona
  title: Лимит эмодзи
  type: int
  range: [0, 6]
  default: 3
  desc: Базовое ограничение на пост. Настроение добавляет или отнимает.
  effect: Выше — теплее и инфантильнее. Ноль — сухо и на неё не похоже.

- key: persona.greeting_cooldown_posts
  group: persona
  title: Пауза между приветствиями
  type: int
  range: [1, 10]
  default: 4
  desc: Через сколько постов разрешено снова здороваться или прощаться.
  effect: Меньше — «доброе утро» в каждом посте, приём стирается. Больше — суше.

- key: persona.reader_question_every
  group: persona
  title: Пауза между вопросами читателю
  type: int
  range: [2, 20]
  default: 5
  desc: Как часто ей можно что-то спросить у читателей.
  effect: Часто — превращается в ритуальное «а как у вас?» в конце каждого поста.

- key: persona.character_share
  group: persona
  title: Доля характера в конспектах
  type: float
  range: [0.05, 0.4]
  default: 0.2
  desc: Какую часть большого поста занимает личное, а не содержание.
  effect: Выше — веселее читать, но конспект теряет ценность. Ниже — сухая выжимка без лица.

# ── Куратор ──────────────────────────────────────────────────────

- key: curator.model
  group: curator
  title: Модель куратора
  type: enum
  values: [sonnet, opus, haiku]
  default: sonnet
  desc: Какую модель поднимает Claude Code CLI для экзаменов.
  effect: Сильнее — точнее вопросы и правки, дороже по лимитам подписки.

- key: curator.effort
  group: curator
  title: Уровень рассуждения
  type: enum
  values: [low, medium, high]
  default: medium
  desc: Флаг --effort при вызове CLI.
  effect: Выше — глубже разбор её ошибок, дольше ответ. Для составления вопросов medium обычно хватает.

- key: curator.exam_every_days
  group: curator
  title: Как часто экзамены
  type: int
  range: [2, 10]
  default: 4
  desc: Минимальный промежуток между проверками.
  effect: Чаще — быстрее движется по темам, но выглядит загнанной. Реже — свободнее, но темы тянутся.

- key: curator.budget_usd_week
  group: curator
  title: Бюджет в неделю
  type: float
  range: [0.0, 50.0]
  default: 5.0
  desc: Потолок расходов на вызовы куратора. При достижении экзамены встают до конца недели.
  effect: Страховка от неожиданного счёта. Ноль — без ограничения.

# ── Мир ──────────────────────────────────────────────────────────

- key: world.weather_source
  group: world
  title: Источник погоды
  type: enum
  values: [api, seasonal, off]
  default: api
  desc: Реальная погода Алматы, сезонная таблица из конфига или без погоды вообще.
  effect: API даёт настоящие совпадения с окном пользователя. Сезонная — правдоподобно, но не точно.

- key: world.weather_chance
  group: world
  title: Как часто упоминает погоду
  type: float
  range: [0.0, 1.0]
  default: 0.15
  desc: Базовая вероятность, что погода попадёт в контекст поста. Экстремальная попадает всегда.
  effect: Выше — канал превращается в метеосводку.

- key: world.situation_chance
  group: world
  title: Мелкие происшествия
  type: float
  range: [0.0, 1.0]
  default: 0.25
  desc: Доля офтопов, где она придумывает бытовую сценку вместо слота из конфига.
  effect: Выше — живее, но растёт шанс, что модель насочиняет странного.

- key: world.news_enabled
  group: world
  title: Новости
  type: bool
  default: true
  desc: Иногда реагирует на заголовок из разрешённых рубрик — наука, космос, животные, техника, город.
  effect: Привязывает её к реальному времени. Политика и происшествия отфильтрованы жёстко.

- key: world.illness_enabled
  group: world
  title: Болезни
  type: bool
  default: true
  desc: Раз в несколько недель простужается на пару дней.
  effect: Даёт естественные паузы и непрерывность. Выключать незачем.

# ── Общение ──────────────────────────────────────────────────────

- key: chat.context_tokens
  group: chat
  title: Окно диалога
  type: int
  range: [4000, 64000]
  default: 16000
  desc: Бюджет контекста на сессию разговора до первого сжатия.
  effect: Больше — помнит дольше, но каждый ответ медленнее и сильнее плывёт голос.

- key: chat.keep_last_turns
  group: chat
  title: Реплик без сжатия
  type: int
  range: [4, 30]
  default: 12
  desc: Сколько последних реплик всегда идут в контекст целиком.
  effect: Меньше — экономнее, но теряется нить недавнего разговора.

- key: chat.session_ttl_hours
  group: chat
  title: Жизнь сессии
  type: int
  range: [1, 48]
  default: 6
  desc: Через сколько часов молчания сессия закрывается сама.
  effect: При закрытии диалог сжимается, факты извлекаются, нити открываются.

- key: chat.reply_delay_base_sec
  group: chat
  title: Задержка ответа
  type: int
  range: [0, 300]
  default: 20
  desc: Базовая пауза перед ответом. Настроение её умножает.
  effect: Ноль — отвечает мгновенно и выглядит ботом. Большая — раздражает при тестировании.

# ── Логи ─────────────────────────────────────────────────────────

- key: log.verbosity
  group: log
  title: Подробность
  type: enum
  values: [quiet, normal, full]
  default: normal
  desc: quiet — только ошибки и переходы автомата, normal — карточки событий, full — карточки плюс полные JSON вложением.
  effect: full удобен в первую неделю, дальше топик становится нечитаемым.

- key: log.attach_prompts
  group: log
  title: Прикладывать промпты
  type: bool
  default: true
  desc: Класть в топик полный текст запроса и ответа файлом.
  effect: Главный инструмент отладки. Без него непонятно, почему пост вышел кривым.

- key: log.show_thoughts
  group: log
  title: Показывать размышления
  type: bool
  default: true
  desc: Выводить содержимое канала thought, когда режим размышления включён.
  effect: Самое интересное для читателя и для тебя. На объём логов влияет заметно.

# ── Система ──────────────────────────────────────────────────────

- key: system.llm_timeout_sec
  group: system
  title: Таймаут локальной модели
  type: int
  range: [30, 600]
  default: 120
  desc: Сколько ждать ответа от llama-server.
  effect: Меньше — чаще ложные обрывы на длинных конспектах. Больше — дольше висит при реальном зависании.

- key: system.max_retries
  group: system
  title: Повторов при ошибке
  type: int
  range: [1, 5]
  default: 3
  desc: Сколько раз перегенерировать после отказа валидатора или сбоя.
  effect: Больше — реже теряются посты, но дольше и горячее ноутбук.

- key: system.paused
  group: system
  title: Пауза
  type: bool
  default: false
  desc: Полная остановка. Ничего не генерируется и не публикуется.
  effect: То же, что /pause. Outbox при этом не теряется.

# ── Закрытые ─────────────────────────────────────────────────────

- key: system.db_path
  group: system
  locked: true
  type: str
  default: "data/mika.db"

- key: system.owner_id
  group: system
  locked: true
  type: int
  desc: Твой telegram id. Только из конфига, не из чата.
