name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Nix tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      - name: Test, lint, verify locks, and run the offline application
        run: nix flake check --no-update-lock-file --print-build-logs
      - name: Build the production environment
        run: nix build .#default --no-link --no-update-lock-file

  repository:
    name: Repository audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out all history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      - name: Reject private deployment files
        run: nix develop .#audit --command python scripts/check_repository.py
      - name: Validate workflow syntax
        run: nix develop .#audit --command actionlint
      - name: Scan complete Git history for credentials
        run: >-
          nix develop .#audit --command gitleaks git
          --config config/gitleaks.toml
          --log-opts="--all --full-history -m"
          --redact=100 --no-banner
