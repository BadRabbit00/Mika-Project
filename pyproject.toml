[project]
name = "blogai"
version = "0.1.0"
authors = [
    { name = "BadRabbit", email = "Alexeyb06@gmail.com" }
]
description = "Storage and timezone foundation for the BlogAI agents"
requires-python = ">=3.12,<3.13"
dependencies = ["structlog>=25.5,<27"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1"]

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ"]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
