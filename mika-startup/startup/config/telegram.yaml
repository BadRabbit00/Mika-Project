owner_id:             # твой telegram user id
supergroup_id: -100  # id супергруппы с топиками
channel_id: 0     # id канала-витрины

topics:
  diary: 0      # Дневник Мики
  author: 0     # Автор
  curator: 0    # Кураторская
  chat: 0       # Разговор
  library: 0    # Библиотека
  machine: 0    # Машинное
  control: 0    # Управление
  # state: 1266  # Optional pinned simulation state; requires the detailed-world revision.

bots:
  mika: MIKA_BOT_TOKEN
  curator: CURATOR_BOT_TOKEN
  ops: OPS_BOT_TOKEN
