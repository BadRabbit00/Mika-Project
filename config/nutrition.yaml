facts:
  meal_start: Наступило запланированное время поесть; ещё выбираю еду и не закончила приём пищи.
  cafe_start: Зашла в кофейню; заказ ещё не оплачен и не съеден.
  dining_start: "Сейчас нахожусь в {venue}, собираюсь поесть; заказ ещё не оплачен и не съеден."
  home_meal: Поела дома готовую домашнюю еду. Порция взята из реального запаса.
  home_large: Из-за сильного голода поела дома и взяла две порции вместо одной.
  hunger: Давно не ела, голод начинает раздражать и мешать сосредоточиться.
  very_hungry: Сильно проголодалась; поесть стало важнее необязательных дел.
  want: "Захотелось небольшого удовольствия: {name}. Пока ничего не покупала."
  unaffordable: "Сейчас не покупаю {name}: после обязательных расходов денег на это мало."
  bought: "Оплатила покупку: {name}, {price} тенге, место — {venue}. Ещё не съела и не выпила."
  consumed: "Ранее купила еду или напиток: {name}. Теперь закончила перекус или приём пищи."
  gum: Ранее купила жвачку, теперь взяла её из своего запаса. Чуть приятнее, но голод не прошёл.
  expired: Часть купленных перекусов испортилась; выбросила их, есть уже нельзя.
  postpone: Решила сначала немного погулять после пар. Обед пока отложен; голод никуда не делся.
  meal_first: Сильно проголодалась и отложила прогулку перед обедом. После пар направлюсь сразу поесть в уже выбранное заведение.
  stay_home: После домашнего обеда передумала выходить на необязательную прогулку; остаюсь дома.
  early_dinner: Проголодалась после отложенного обеда и перенесла ужин на более раннее время.
  skipped_meal: Сейчас ещё сыта после недавней еды; второй обед или ужин подряд не нужен.
  chose_to_skip: Отложила приём пищи ради отдыха или другого занятия. Пока не поела, голод сохранится.
  no_food: Голодная, но готовой еды нет; нужно приготовить из имеющихся продуктов или сначала купить продукты.
  ordering: выбор и оплата еды
  eating: приём пищи
  snacking: небольшой перекус
  home_eating: домашний приём пищи
  craving_trip: поход за небольшим перекусом
  food_travel: дорога за едой
  food_shopping: покупка продуктов для домашней еды
  cooking_meal: готовка и домашний приём пищи
  cooked: Домашняя еда приготовлена из имеющихся ингредиентов; теперь можно поесть.
  meal_visit: обед в заведении
  walk_before_meal: прогулка перед отложенным обедом
  homecoming: дорога домой
