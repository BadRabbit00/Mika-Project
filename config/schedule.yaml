# config/schedule.yaml — расписание и пробуждение
#
# Из этого файла код знает, что она делает в любой момент,
# и может честно сказать: «в 8:40 у неё была пара, она не спала».
# Именно отсюда берётся согласованность жалоб на недосып.

timezone: Asia/Almaty

# ══════════════════════════════════════════════════════════════════
# 1. УНИВЕР. Второй курс, медиакоммуникации.
# ══════════════════════════════════════════════════════════════════

university:
  monday:
    - {from: "09:00", to: "10:20", subject: статистика,        mood: [-0.10, -0.05, -0.10]}
    - {from: "10:30", to: "11:50", subject: история медиа,     mood: [+0.15, +0.05, +0.10]}
    - {from: "12:00", to: "13:20", subject: английский,        mood: [+0.05,  0.00, +0.05]}
  tuesday: []
  wednesday:
    - {from: "09:00", to: "10:20", subject: теория коммуникации, mood: [+0.05, 0.00, +0.05]}
    - {from: "10:30", to: "11:50", subject: статистика,          mood: [-0.10, -0.05, -0.15]}
    - {from: "12:00", to: "13:20", subject: медиаправо,          mood: [-0.05, -0.10, 0.00]}
    - {from: "13:30", to: "14:50", subject: практикум,           mood: [+0.10, +0.10, +0.10]}
  thursday: []
  friday:
    - {from: "10:50", to: "12:10", subject: философия,         mood: [+0.10, -0.05, +0.05]}
    - {from: "12:20", to: "13:40", subject: английский,        mood: [+0.05,  0.00, +0.05]}
    - {from: "13:50", to: "15:10", subject: практикум,         mood: [+0.10, +0.10, +0.10]}
  saturday: []
  sunday: []

commute_minutes: 35
alarm_before_first_class_min: 70     # встать, собраться, доехать

# Неделя семестра влияет на фон. Считается от start в life.yaml.
semester_pressure:
  weeks: {6: midterm, 14: зачётная}
  midterm_mood: [-0.15, +0.20, -0.15]     # держится всю неделю
  session_mood: [-0.20, +0.25, -0.20]

# ══════════════════════════════════════════════════════════════════
# 2. ПРОБУЖДЕНИЕ
#
#    Будний день с парами → будильник, alarm_before_first_class_min
#    Будний день без пар  → свободный подъём 09:30–12:00
#    Выходной             → свободный подъём 09:00–13:00
#
#    Но сначала бросается кубик на внешнее пробуждение.
# ══════════════════════════════════════════════════════════════════

wake:
  free_window:
    weekday_no_classes: ["09:30", "12:00"]
    weekend:            ["09:00", "13:00"]

  # Внешние пробуждения. Проверяются по порядку, первое сработавшее
  # отменяет остальные. Каждое даёт свой эффект на настроение
  # и свой повод для утреннего поста.
  interruptions:
    - id: mama_call
      when: {weekday: [sunday], window: ["09:00", "11:00"]}
      chance: 0.55
      mood: [+0.10, +0.25, 0.00]
      text_hint: "мама позвонила, как всегда рано, спрашивала, ем ли я"

    - id: dasha_hairdryer
      window: ["07:40", "08:30"]
      when: {weekday: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]}
      chance: 0.12
      mood: [-0.20, +0.30, -0.05]
      text_hint: "Даша включила фен в восемь утра"

    - id: timur_message
      when: {window: ["08:00", "11:00"]}
      chance: 0.10
      mood: [+0.25, +0.20, +0.05]
      text_hint: "проснулась от сообщения от Тимура"
      requires_trigger_state: not_fighting

    - id: delivery_doorbell
      window: ["10:00", "18:00"]
      chance: 0.05
      mood: [-0.25, +0.35, -0.10]
      text_hint: "курьер перепутал квартиру"

    - id: neighbors_drill
      when: {weekday: [saturday, sunday], window: ["09:00", "11:00"]}
      chance: 0.15
      mood: [-0.30, +0.25, -0.10]
      text_hint: "соседи сверху начали сверлить"

    - id: overslept
      window: ["+0:00", "+0:45"]
      when: {has_classes: true}
      chance: 0.12
      mood: [-0.30, +0.40, -0.25]
      text_hint: "проспала, собиралась за десять минут"
      effect: {missed_first_class: true}

  # Сколько ей нужно сна, чтобы быть в норме
  sleep_need_hours: 8.0
  debt_cap_hours: 12.0        # долг больше не копится

# ══════════════════════════════════════════════════════════════════
# 3. ЧТО ОНА ДЕЛАЕТ В ТЕЧЕНИЕ ДНЯ
#    Используется для блока day_context и для выбора места.
# ══════════════════════════════════════════════════════════════════

day_shape:
  after_classes:    {from: "15:00", to: "17:00", what: [обед, дорога домой, сон часок]}
  study_window:     {from: "17:00", to: "22:00", what: [читает статьи, пишет конспект]}
  night_window:     {from: "22:00", to: "02:00", what: [сериал, залипает в телефоне, доделывает]}

  free_day_shape:
    morning:  [долго валяется, завтракает, разбирает дела]
    afternoon: [универские задания, прогулка, кофейня]
    evening:  [учёба, сериал]

# ══════════════════════════════════════════════════════════════════
# 4. ЗАНЯТОСТЬ — когда постов быть не должно
# ══════════════════════════════════════════════════════════════════

blackout:
  - {reason: сон, source: sleep_model}
  - {reason: пара, source: university, grace_after_min: 5, grace_before_min: 0}
  - reason: дорога
    derive: {from_first_class: true, minus_minutes: 45, length_minutes: 40}
    chance_to_post: 0.3

mood_labels:
  stuck: {learning_state: WAITING, min_rounds: 2}
  down: {p_below: -0.35}
