facts:
  groceries: Купила ингредиенты по списку. Это продукты для готовки, а не уже
    съеденный ужин.
  cooked: Блюдо приготовлено из имеющихся продуктов; порции и использованные
    ингредиенты сохранены.
  spoiled: Проверила продукты и выбросила испортившееся; из них больше нельзя
    готовить.
  calendar_busy: У знакомого уже есть сохранённые дела на это время.
  appointment: Встреча согласована на свободное время; дорога и место сохранены,
    сама встреча ещё впереди.
  no_slot: Подходящего общего окна пока нет; встреча не назначена.
  ended: Занятие закончилось раньше завершения эпизода; действие не выполнено и
    последствий нет.
  clinic_wait: Пришла на назначенный приём; жду своей очереди, справки пока нет.
  clinic_finished: Плановый приём закончился, справка получена; новый диагноз не
    выдумывается.
