    thesis: >
      Одна и та же модель становится агентом в момент, когда получает
      право на побочный эффект: запись в файл, сетевой запрос, запуск процесса.
    keywords: [агент, побочный эффект, права]
    image_hint: "две коробки: одна с выходом только вниз в текст, вторая с тремя стрелками в систему"
