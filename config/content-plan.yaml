    rubric: keys
    title: "Агент, который снёс прод-базу"
    thesis: >
      Самые громкие провалы агентов — не взлом, а исполнительность:
      агент буквально сделал то, что попросили, в окружении,
      где этого делать было нельзя.
    keywords: [инцидент, прод, необратимые операции]
    image_hint: "терминал, зелёный ok, красная строка DROP DATABASE"
