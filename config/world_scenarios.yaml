# Authored fictional event trees. Nodes consume real time; prose never selects outcomes.
version: 1
scenarios:
  park_treat:
    trigger:
      places:
      - парк
      kinds:
      - walk
      - park_rest
      min_minutes: 20
    chance: 0.7
    cooldown_days: 1
    within_activity: true
    entry: buy
    nodes:
      buy:
        minutes:
        - 6
        - 12
        outcomes:
        - id: bought
          facts: Купила одну сладкую вату у киоска в парке; покупка оплачена.
          next: eat
          when:
            cash_gte: 3700
          food: {action: buy, product: cotton_candy, price: 700, reserve: 3000, shelf_hours: 8}
        - id: saved
          facts: Посмотрела на сладкую вату и решила сохранить деньги; ничего не
            купила.
          next: fountain
      eat:
        minutes:
        - 6
        - 10
        outcomes:
        - id: finished
          facts: Доела купленную сладкую вату на скамейке; второй порции сегодня
            не покупала.
          next: fountain
          food: {action: eat, product: cotton_candy, meal: false, satiety: 6}
          mood: life_treat
      fountain:
        minutes:
        - 8
        - 12
        outcomes:
        - id: rested
          facts: Посидела у фонтана и послушала воду; после паузы стало
            спокойнее.
          next:
          mood: life_rest
    label: сладкая вата в парке
  park_carousel:
    trigger:
      places:
      - парк
      kinds:
      - walk
      - park_rest
      min_minutes: 20
    chance: 0.25
    cooldown_days: 1
    within_activity: true
    entry: look
    nodes:
      look:
        minutes:
        - 5
        - 8
        outcomes:
        - id: ticket
          facts: Выбрала карусель и купила один билет; очередь ещё впереди.
          next: queue
          when:
            cash_gte: 4200
          money: -1200
        - id: watch
          facts: Решила посмотреть на карусель со стороны и не тратиться.
          next: watch
      queue:
        minutes:
        - 8
        - 12
        outcomes:
        - id: ride
          facts: Дождалась очереди и прокатилась; аттракцион закончился.
          next: watch
          mood: life_warmth
      watch:
        minutes:
        - 5
        - 9
        outcomes:
        - id: quiet
          facts: После шума отошла на тихую аллею и немного выдохнула.
          next:
          mood: life_rest
    label: карусель в парке
  park_sketch:
    trigger:
      places:
      - парк
      kinds:
      - walk
      - park_rest
      min_minutes: 20
    chance: 0.4
    cooldown_days: 1
    within_activity: true
    entry: notice
    nodes:
      notice:
        minutes:
        - 5
        - 8
        outcomes:
        - id: light
          facts: Остановилась посмотреть, как свет ложится на воду; захотелось
            сохранить это наблюдение.
          next: draw
      draw:
        minutes:
        - 12
        - 18
        outcomes:
        - id: sketch
          facts: Сделала быстрый набросок фонтана в блокноте; рисунок далёк от
            идеала.
          next: finish
          mood: life_achievement
      finish:
        minutes:
        - 5
        - 7
        outcomes:
        - id: kept
          facts: Убрала блокнот и оставила доработку рисунка для дома; пока
            только набросок.
          next:
          flags:
            sketch_pending: true
    label: рисунок в парке
  invite_dasha:
    trigger:
      places:
      - дом
      - универ
      kinds:
      - rest
      - break
      min_minutes: 6
    chance: 0.25
    cooldown_days: 2
    within_activity: false
    entry: invite
    nodes:
      invite:
        publication: latest
        label: пишу приглашение на встречу
        minutes:
        - 2
        - 4
        outcomes:
        - id: sent
          social_plan: {person: dasha, status: waiting}
          facts: 'Написала Даше: предложила встретиться, но ответа и договорённости
            ещё нет.'
          next: reply
          flags:
            social_waiting: dasha
      reply:
        minutes:
        - 10
        - 35
        outcomes:
        - id: busy
          social_plan: {person: dasha, status: declined_busy}
          facts: 'Даша ответила: сейчас занята своими делами и сегодня встретиться
            не получится. Мне стало немного грустно.'
          next: alternative
          when:
            npc_busy: dasha
          mood: life_uncertainty
          flags:
            social_waiting:
            social_disappointment: 1
          contact: dasha
        - id: tired
          social_plan: {person: dasha, status: declined_tired}
          facts: 'В ответе на приглашение попросили сегодня обойтись без встречи:
            нет сил на общение. Мне грустно, но это не означает разрыв отношений.'
          next: alternative
          when:
            npc_mood:
              person: dasha
              is: tired
          contact: dasha
          mood: life_uncertainty
        - id: free
          publication: latest
          social_plan: {person: dasha, status: negotiating}
          facts: Даша ответила и готова обсудить свободное время. Встреча ещё не
            назначена.
          next: agree
          flags:
            social_waiting:
          contact: dasha
        passive: true
      agree:
        label: согласовываю время встречи
        minutes:
        - 5
        - 10
        outcomes:
        - id: reserved
          social_plan: {person: dasha, status: scheduled}
          facts: Согласовали время и место встречи с Дашей; я записала
            договорённость, сама встреча ещё впереди.
          next: attend
          appointment:
            person: dasha
            location: парк
            minutes: 35
          mood: life_warmth
        - id: no_window
          social_plan: {person: dasha, status: no_window}
          facts: Сравнили планы и не нашли подходящего общего окна. Решили
            попробовать в другой день.
          next: alternative
          mood: life_uncertainty
      attend:
        label: общаюсь на встрече
        minutes:
        - 10
        - 15
        outcomes:
        - id: met
          social_plan: {person: dasha, status: met}
          facts: Встретились с Дашей в согласованном месте и поговорили; встреча
            действительно состоялась.
          next: remember
          when:
            appointment_present: dasha
          attend: dasha
          mood: life_warmth
        places:
        - парк
        - дом
        kinds:
        - walk
        - park_rest
        - rest
      alternative:
        label: домашние дела вместо встречи
        minutes:
        - 15
        - 25
        outcomes:
        - id: home
          social_plan: {person: dasha, status: home_alternative}
          facts: Вместо несостоявшейся встречи решила спокойно заняться
            домашними делами. Отказ не означает ссору.
          next: remember
          flags:
            missing_friend: true
        places:
        - дом
        kinds:
        - rest
        - drawing
        - movie
      remember:
        passive: true
        publication: silent
        minutes:
        - 8
        - 15
        outcomes:
        - id: settled
          facts: 'Вернулась мыслями к разговору: планы изменились, но общение не оборвалось.
            Позже можно предложить другое время.'
          next:
          mood: life_rest
    label: планы на встречу с Дашей
